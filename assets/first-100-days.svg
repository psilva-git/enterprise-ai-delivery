<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">First 100 Days Operating Blueprint</title><desc id="desc">Four phases: Understand, Position, Execute, Prove and Scale.</desc>
<rect width="1200" height="470" fill="#FFFFFF"/>
<text x="60" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">FIRST 100 DAYS</text>
<text x="60" y="101" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#0F172A">Build the fact base. Make choices. Create rhythm. Scale evidence.</text>
<line x1="150" y1="225" x2="1050" y2="225" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
<circle cx="170" cy="225" r="28" fill="#0F3D5E"/><circle cx="455" cy="225" r="28" fill="#0F5B55"/><circle cx="740" cy="225" r="28" fill="#16697A"/><circle cx="1025" cy="225" r="28" fill="#0F3D5E"/>
<text x="170" y="232" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text><text x="455" y="232" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text><text x="740" y="232" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text><text x="1025" y="232" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
<text x="170" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">DAYS 1–25</text><text x="170" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F3D5E">UNDERSTAND</text>
<text x="455" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">DAYS 26–50</text><text x="455" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F5B55">POSITION</text>
<text x="740" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">DAYS 51–75</text><text x="740" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#16697A">EXECUTE</text>
<text x="1025" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">DAYS 76–100</text><text x="1025" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F3D5E">PROVE &amp; SCALE</text>
<rect x="65" y="280" width="210" height="110" rx="16" fill="#F5F8FC" stroke="#9FB3C8"/>
<text x="170" y="315" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">FACT BASE</text><text x="170" y="343" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">Market · accounts · value</text><text x="170" y="365" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">delivery · capability</text>
<rect x="350" y="280" width="210" height="110" rx="16" fill="#F1F7F7" stroke="#83AFA7"/>
<text x="455" y="315" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">CHOICES &amp; TARGETS</text><text x="455" y="343" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">Segments · account tiers</text><text x="455" y="365" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">KPIs · route-to-market</text>
<rect x="635" y="280" width="210" height="110" rx="16" fill="#EEF6F8" stroke="#6C9BAD"/>
<text x="740" y="315" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">OPERATING RHYTHM</text><text x="740" y="343" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">Accounts · CRM · team</text><text x="740" y="365" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">delivery · partners</text>
<rect x="920" y="280" width="210" height="110" rx="16" fill="#0F3D5E"/>
<text x="1025" y="315" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">EVIDENCE &amp; SCALE</text><text x="1025" y="343" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#DCEAF3">Scale · reshape · pause</text><text x="1025" y="365" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#DCEAF3">invest where proven</text>
<text x="600" y="438" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#64748B">The fifth question behind every phase: What should we deliberately not do yet?</text>
</svg>