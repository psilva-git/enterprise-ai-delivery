<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Strategic Account Tiering</title><desc id="desc">Prioritization of relevant accounts into strategic bets, build accounts and partner or monitor accounts.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6B7F8F"/></marker></defs>
<rect width="1200" height="430" fill="#FFFFFF"/>
<text x="60" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">STRATEGIC ACCOUNT TIERING</text>
<text x="60" y="99" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#0F172A">Allocate senior attention where the opportunity justifies it</text>
<rect x="80" y="155" width="260" height="120" rx="18" fill="#F5F8FC" stroke="#9FB3C8" stroke-width="2"/>
<text x="210" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0F3D5E">RELEVANT ACCOUNT UNIVERSE</text><text x="210" y="226" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">fit · urgency · value</text><text x="210" y="248" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">delivery credibility</text>
<line x1="340" y1="215" x2="430" y2="215" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="455" y="135" width="210" height="95" rx="18" fill="#0F3D5E"/>
<text x="560" y="174" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">TIER 1</text><text x="560" y="201" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#DCEAF3">Strategic Bets</text>
<rect x="455" y="250" width="210" height="95" rx="18" fill="#F1F7F7" stroke="#83AFA7" stroke-width="2"/>
<text x="560" y="289" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0F5B55">TIER 2</text><text x="560" y="316" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">Build</text>
<rect x="455" y="365" width="210" height="50" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="560" y="397" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#475569">TIER 3 · Partner / Monitor</text>
<line x1="665" y1="182" x2="760" y2="182" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="790" y="125" width="330" height="160" rx="18" fill="#EEF6F8" stroke="#6C9BAD" stroke-width="2"/>
<text x="955" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#164E63">TIER 1 LEADERSHIP ATTENTION</text>
<text x="820" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">Executive access · real customer problem</text><text x="820" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">Value hypothesis · technical feasibility</text><text x="820" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">Concrete next commercial step · expansion path</text>
<text x="600" y="406" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="1" fill="#FFFFFF">.</text>
</svg>