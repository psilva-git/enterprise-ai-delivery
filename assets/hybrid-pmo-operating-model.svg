<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 882" role="img" aria-labelledby="title desc">
<title id="title">PMO, Transformation and Delivery Governance Operating Model</title>
<desc id="desc">Executive operating model linking strategy, portfolio governance, programs, fit-for-purpose delivery, teams and business outcomes with governance, KPIs, risk and value controls.</desc>
<defs>
