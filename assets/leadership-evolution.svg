<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 882" role="img" aria-labelledby="title desc">
<title id="title">Leadership Evolution</title>
<desc id="desc">Leadership evolution from engineering through R&amp;D, delivery scale, commercial leadership and consulting to enterprise AI and agents, built on the same technical foundation.</desc>
<defs>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B2E4F"/>
    <stop offset="1" stop-color="#123E67"/>
  </linearGradient>
  <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1F4F7A"/>
    <stop offset="0.55" stop-color="#177C84"/>
    <stop offset="1" stop-color="#0C6C8B"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#F8FBFD"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
</defs>

<rect width="1400" height="820" fill="#FFFFFF"/>

