<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Enterprise AI Value Realization</title><desc id="desc">A stage-gate model from customer problem through value, feasibility, governed delivery, adoption, evidence and expansion.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6B7F8F"/></marker></defs>
<rect width="1200" height="540" fill="#FFFFFF"/>
<text x="60" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">ENTERPRISE AI VALUE REALIZATION</text>
<text x="60" y="101" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#0F172A">From a real customer problem to evidence strong enough to scale</text>
<text x="130" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">BUSINESS</text><text x="475" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">SOLUTION</text><text x="790" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">DELIVERY</text><text x="1035" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">SCALE</text>
<line x1="200" y1="255" x2="1015" y2="255" stroke="#CBD5E1" stroke-width="3"/>
<g font-family="Segoe UI,Arial,sans-serif">
<circle cx="160" cy="255" r="46" fill="#F5F8FC" stroke="#9FB3C8" stroke-width="2"/><text x="160" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#0F3D5E">CUSTOMER</text><text x="160" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#0F3D5E">PROBLEM</text>
<circle cx="330" cy="255" r="46" fill="#F5F8FC" stroke="#9FB3C8" stroke-width="2"/><text x="330" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#0F3D5E">VALUE</text><text x="330" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#0F3D5E">HYPOTHESIS</text>
<circle cx="500" cy="255" r="46" fill="#F1F7F7" stroke="#83AFA7" stroke-width="2"/><text x="500" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#0F5B55">USE CASE</text><text x="500" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#0F5B55">FIT</text>
<circle cx="670" cy="255" r="46" fill="#F1F7F7" stroke="#83AFA7" stroke-width="2"/><text x="670" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#0F5B55">FEASIBILITY</text><text x="670" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#0F5B55">&amp; RISK</text>
<circle cx="840" cy="255" r="46" fill="#EEF6F8" stroke="#6C9BAD" stroke-width="2"/><text x="840" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#164E63">GOVERNED</text><text x="840" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#164E63">DELIVERY</text>
<circle cx="1010" cy="255" r="46" fill="#0F3D5E"/><text x="1010" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">EVIDENCE</text><text x="1010" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">&amp; SCALE</text>
</g>
<line x1="206" y1="255" x2="277" y2="255" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/><line x1="376" y1="255" x2="447" y2="255" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/><line x1="546" y1="255" x2="617" y2="255" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/><line x1="716" y1="255" x2="787" y2="255" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/><line x1="886" y1="255" x2="957" y2="255" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="100" y="360" width="1000" height="100" rx="18" fill="#F8FAFC" stroke="#D8E1EA"/>
<text x="600" y="392" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">GUARDRAILS ACROSS EVERY STAGE</text>
<text x="600" y="426" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#475569">Data · Governance · Human Control · Traceability · Adoption · Economic Relevance</text>
<text x="600" y="495" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#64748B">Do not scale because the technology is interesting. Scale when evidence proves customer and business value.</text>
</svg>