<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">AI Human Control and Traceability</title><desc id="desc">A controlled AI workflow with approved context, human review gate and traceable output.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6B7F8F"/></marker></defs>
<rect width="1200" height="470" fill="#FFFFFF"/>
<text x="60" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">GOVERNED AI WORKFLOW</text>
<text x="60" y="101" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#0F172A">Automation where useful. Human accountability where required.</text>
<rect x="55" y="185" width="165" height="88" rx="16" fill="#F5F8FC" stroke="#9FB3C8" stroke-width="2"/><text x="137" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#0F3D5E">BUSINESS / USER</text><text x="137" y="248" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">intent &amp; ownership</text>
<rect x="265" y="185" width="165" height="88" rx="16" fill="#F1F7F7" stroke="#83AFA7" stroke-width="2"/><text x="347" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#0F5B55">AI ASSISTANCE</text><text x="347" y="248" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">bounded automation</text>
<rect x="475" y="150" width="175" height="70" rx="16" fill="#EEF6F8" stroke="#6C9BAD" stroke-width="2"/><text x="562" y="180" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#164E63">APPROVED CONTEXT</text><text x="562" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">trusted knowledge</text>
<rect x="475" y="245" width="175" height="70" rx="16" fill="#EEF6F8" stroke="#6C9BAD" stroke-width="2"/><text x="562" y="275" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#164E63">WORKFLOW STEP</text><text x="562" y="297" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">controlled execution</text>
<polygon points="760,160 845,229 760,298 675,229" fill="#FFF8E6" stroke="#C49A3A" stroke-width="2"/>
<text x="760" y="218" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7A5A13">HUMAN REVIEW</text><text x="760" y="240" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7A5A13">required?</text>
<rect x="900" y="185" width="170" height="88" rx="16" fill="#0F3D5E"/><text x="985" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">CONTROLLED</text><text x="985" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">OUTPUT</text>
<line x1="220" y1="229" x2="255" y2="229" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/><line x1="430" y1="229" x2="465" y2="229" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/><line x1="650" y1="229" x2="670" y2="229" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/><line x1="845" y1="229" x2="890" y2="229" stroke="#6B7F8F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="350" width="540" height="62" rx="18" fill="#F8FAFC" stroke="#D8E1EA"/>
<text x="600" y="389" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#475569">TRACEABILITY · DECISION OWNERSHIP · RESULT</text>
